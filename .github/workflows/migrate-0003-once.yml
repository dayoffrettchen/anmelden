name: Einmalige D1-Migration 0003

on:
  push:
    branches:
      - ops/apply-invites-migration-once

permissions:
  contents: read

concurrency:
  group: anmelden-cloudflare-production
  cancel-in-progress: false

jobs:
  tests:
    if: github.event.head_commit.message == 'Run one-time D1 invitations migration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  migrate:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Confirm only migration 0003 is pending
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 migrations list anmelden --remote | tee "$RUNNER_TEMP/pending-migrations.txt"
          grep -q '0003_invites.sql' "$RUNNER_TEMP/pending-migrations.txt" || {
            echo "::error::Migration 0003 ist nicht als offen aufgeführt. Ohne Änderung beendet."
            exit 1
          }
          COUNT=$(grep -cE '000[0-9]_.*\.sql' "$RUNNER_TEMP/pending-migrations.txt" || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Unerwartete weitere Migrationen. Ohne Änderung beendet."
            exit 1
          fi
      - name: Record Cloudflare D1 recovery bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 time-travel info anmelden
          echo "D1 Bookmark steht im Protokoll dieses Schritts. Keine automatische Wiederherstellung." >> "$GITHUB_STEP_SUMMARY"
      - name: Apply the production migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply anmelden --remote
          npx wrangler d1 execute anmelden --remote \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'trip_invites';" \
            | tee "$RUNNER_TEMP/schema-check.txt"
          grep -q 'trip_invites' "$RUNNER_TEMP/schema-check.txt" || {
            echo "::error::Schema fehlt nach Migration."
            exit 1
          }
      - name: Report migration success
        run: echo "Migration 0003 angewandt. Nur die Remote-D1-Datenbank wurde geändert; Worker wurde nicht neu deployed." >> "$GITHUB_STEP_SUMMARY"
