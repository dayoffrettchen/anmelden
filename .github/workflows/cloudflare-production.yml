name: Cloudflare Produktion (manuell)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operation: erst inspect, danach migrate, zuletzt deploy"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - migrate
          - deploy

permissions:
  contents: read

concurrency:
  group: anmelden-cloudflare-production
  cancel-in-progress: false

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check public/app.js
      - run: npm run build

  cloudflare:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Cloudflare-Zugang pruefen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN fehlt."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID fehlt."; exit 1; }
          npx wrangler whoami

      - name: Remote D1 Zustand lesen
        if: inputs.operation == 'inspect'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations list anmelden --remote
          npx wrangler d1 execute anmelden --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'trip_invites';"

      - name: Wiederherstellungspunkt vor Migration notieren
        if: inputs.operation == 'migrate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 info anmelden
          npx wrangler d1 time-travel info anmelden
          echo "Vorherigen D1 Bookmark im Job-Log aufbewahren. Keine automatisierte Wiederherstellung." >> "$GITHUB_STEP_SUMMARY"

      - name: Fehlende Migrationen ausfuehren (Produktion)
        if: inputs.operation == 'migrate'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply anmelden --remote
          npx wrangler d1 execute anmelden --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'trip_invites';"

      - name: Vor Deployment D1-Schema sicherstellen
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute anmelden --remote --json --command "SELECT COUNT(*) AS present FROM sqlite_master WHERE type = 'table' AND name = 'trip_invites';" > "$RUNNER_TEMP/anmelden-d1.json"
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const rows = (Array.isArray(data) ? data : [data]).flatMap(x => x.results ?? []);
            if (Number(rows[0]?.present) !== 1) {
              console.error("Migration 0003 fehlt: Tabelle trip_invites ist nicht vorhanden. Erst migrate ausfuehren.");
              process.exit(1);
            }
          ' "$RUNNER_TEMP/anmelden-d1.json"

      - name: Worker nach Cloudflare deployen
        if: inputs.operation == 'deploy'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Oeffentlichen Endpunkt pruefen
        if: inputs.operation == 'deploy'
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 2 \
            https://anmelden.dayoffrettchen.workers.dev/api/auth/me \
            | node -e '
              let content = "";
              process.stdin.on("data", chunk => content += chunk);
              process.stdin.on("end", () => {
                const payload = JSON.parse(content);
                if (payload.localPreview !== false || !("user" in payload)) {
                  console.error("Unerwartete Antwort des produktiven Login-Endpunkts.");
                  process.exit(1);
                }
                console.log("Produktiver Login-Endpunkt antwortet.");
              });
            '
