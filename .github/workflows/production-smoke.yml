name: Produktionspruefung (nur lesend)

on:
  push:
    branches: ['ops/production-smoke-readonly']
    paths:
      - '.github/workflows/production-smoke.yml'
      - 'scripts/production-smoke.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anmelden-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check scripts/production-smoke.mjs
      - name: Read-only production HTTP checks
        run: node scripts/production-smoke.mjs
      - name: Store result without response bodies or secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-result
          path: production-smoke-result.json
          if-no-files-found: ignore
          retention-days: 7
