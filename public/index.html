<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden · Fahrgemeinschaften</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
<main>
  <header>
    <p class="brand">Anmelden</p>
    <h1>Fahrgemeinschaften</h1>
    <p>Plane einen Ausflug und reserviere Plätze für Hin- und Rückfahrt.</p>
    <p class="notice">Lokaler Funktionstest mit gemeinsamer Datenbank und Testpersonen.</p>
  <label>Testperson <select id="identity"><option value="mara">Mara</option><option value="oskar">Oskar</option><option value="alex">Alex</option></select></label>
</header>
  <section aria-labelledby="create-title">
    <h2 id="create-title">Ausflug anlegen</h2>
    <form id="trip-form">
      <label>Name des Ausflugs <input name="title" required maxlength="100"></label>
      <label>Ziel <input name="destination" required maxlength="150"></label>
      <label>Ankunft am Ziel <input name="arrival" type="datetime-local" required></label>
      <label>Zwischenstopp (optional) <input name="stop" maxlength="150"></label>
      <button>Ausflug anlegen</button>
    </form>
  </section>
  <div id="trips"></div>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<template id="trip-template">
  <section class="trip">
    <h2></h2>
    <p class="details"></p>
    <div class="rides"></div>
    <details>
      <summary>Fahrt anbieten</summary>
      <form class="offer">
        <label>Richtung <select name="direction"><option value="outbound">Hinfahrt</option><option value="return">Rückfahrt</option></select></label>
        <label>Abfahrts- oder Abholort <input name="pickup" required maxlength="150"></label>
        <label>Freie Plätze <input name="capacity" type="number" min="1" max="8" value="1" required></label>
        <button>Fahrt anbieten</button>
      </form>
    </details>
  </section>
</template>
<template id="ride-template">
  <article>
    <h4></h4>
    <p class="availability"></p>
    <form class="booking">
      <button>Platz reservieren</button>
    </form>
  </article>
</template>
</body>
</html>
